<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вариант 3 — смена цвета блока</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        #colorBlock {
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 6px;
            background: #eee;
            color: #000;
            text-align: center;
            font-size: 16px;
            transition: background-color 0.3s, color 0.3s;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Смена цвета блока</h1>

        <!-- Блок с текстом -->
        <div id="colorBlock">Этот блок меняет цвет при нажатии кнопки</div>

        <!-- Кнопка -->
        <button id="colorBtn">Сменить цвет</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
